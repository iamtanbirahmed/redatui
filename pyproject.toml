[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redatui"
version = "0.1.0"
description = "Redis TUI client — key browser + data viewer with Vim keybindings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Tanbir Ahmed", email = "tanbir.sagar@gmail.com"}
]
keywords = ["redis", "tui", "cli", "keyboard-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Shells",
]

dependencies = [
    "textual>=0.40.0",
    "redis>=5.0.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
redatui = "redatui.__main__:main"
rdt = "redatui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redatui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
